name: Usulan fitur
description: Usulkan peningkatan untuk Rahayat CMS.
title: "[Fitur]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solusi yang diusulkan
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatif yang sudah dipertimbangkan
  - type: textarea
    id: impact
    attributes:
      label: Dampak
      description: Jelaskan dampak pada pengguna, keamanan, database, dan deployment.
